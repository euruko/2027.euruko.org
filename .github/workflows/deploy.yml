name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dokku/github-action@v1.10.0
        with:
          git_remote_url: ssh://dokku@178.104.143.96:22/website
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
